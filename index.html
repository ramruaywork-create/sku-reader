<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WARRIX SKU Reader</title>
<!-- OCR: Tesseract.js (Apache-2.0) ทำงานในเครื่อง ไม่ส่งภาพออกอินเทอร์เน็ต -->
<style>
:root{--bg:#f4f6f8;--panel:#fff;--line:#d9dfe5;--text:#1d2730;--muted:#5d6a76;--accent:#1f6fb2;--accent-text:#fff;--good:#14733f;--warn:#8a5a00;--warn-bg:#fff6df;--bad:#b3261e;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#14191e;--panel:#1d242b;--line:#34404b;--text:#e7edf2;--muted:#9eacb8;--accent:#5aa9e6;--accent-text:#0d1720;--good:#62c98d;--warn:#f0c45c;--warn-bg:#352b12;--bad:#ff8a80;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 "Segoe UI","Leelawadee UI",Tahoma,sans-serif}
main{max-width:1040px;margin:0 auto;padding:24px 16px 56px}
h1{font-size:20px;line-height:28px;margin:0 0 16px;font-weight:600}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:6px 12px}
button:hover{border-color:var(--accent)}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-text);font-weight:600}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
#drop{display:flex;align-items:center;gap:16px;flex-wrap:wrap;background:var(--panel);border:1px dashed var(--line);border-radius:8px;padding:20px 24px}
#drop.over{border-color:var(--accent);border-style:solid}
#drop strong{display:block;font-size:16px}
#drop span{color:var(--muted)}
#drop .grow{flex:1;min-width:220px}
#status{margin-top:16px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px 16px}
#status.error{color:var(--bad);border-color:var(--bad)}
#bar{height:4px;background:var(--line);border-radius:2px;margin-top:8px;overflow:hidden}
#bar-fill{height:100%;width:0;background:var(--accent);transition:width .15s linear}
#result{margin-top:16px;background:var(--panel);border:1px solid var(--line);border-radius:8px;overflow:clip}
.summary{position:sticky;top:0;z-index:2;background:var(--panel);display:flex;align-items:center;gap:8px 20px;flex-wrap:wrap;padding:12px 16px;border-bottom:1px solid var(--line)}
.summary b{font-size:18px;font-variant-numeric:tabular-nums}
.summary .actions{margin-left:auto;display:flex;align-items:center;flex-wrap:wrap;gap:8px}
.merge{display:inline-flex;align-items:center;gap:6px;cursor:pointer;margin-right:4px}
.good{color:var(--good);font-weight:600}.warn{color:var(--warn);font-weight:600}.bad{color:var(--bad);font-weight:600}
tr.group th{background:var(--bg);padding:8px;font-weight:400;font-size:13px;color:var(--text)}
.ghead{display:flex;align-items:center;gap:4px 16px;flex-wrap:wrap}
.ghead .gname{font-weight:600;max-width:320px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ghead button{margin-left:auto;font-size:12px;padding:2px 8px}
.table{overflow-x:auto}
table{width:100%;min-width:760px;border-collapse:collapse}
th{font-size:12px;color:var(--muted);text-align:left;font-weight:600;padding:8px;border-bottom:1px solid var(--line)}
td{padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
tr.flag td{background:var(--warn-bg)}
.num{width:40px;color:var(--muted);text-align:right;padding-top:12px;font-variant-numeric:tabular-nums}
.seen{width:300px;white-space:nowrap}
.seen canvas{display:inline-block;vertical-align:middle;background:#fff;border:1px solid var(--line);border-radius:3px;margin-right:6px;max-width:210px}
td input{width:100%;min-width:190px;height:32px;padding:4px 8px;border:1px solid var(--line);border-radius:5px;background:var(--panel);font-family:Consolas,"Segoe UI",monospace}
td input.qty{width:72px;min-width:72px;text-align:right}
.chips{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px}
.chips button{padding:1px 6px;font:12px Consolas,monospace}
.chips select{height:26px;padding:1px 4px;border:1px solid var(--line);border-radius:5px;background:var(--panel);color:var(--text);font:12px "Segoe UI","Leelawadee UI",Tahoma,sans-serif}
#db-status{display:block;margin-top:2px;color:var(--muted);font-size:12px}
#db-status.warn{color:var(--warn)}
.dbnote{display:block;margin-top:2px;color:var(--bad);font-weight:600}
.state{width:120px;padding-top:9px;color:var(--muted);font-size:12px;white-space:nowrap}
.state button{font-size:12px;padding:3px 8px}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:8px 16px;border-radius:6px;max-width:calc(100vw - 32px)}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>
  <h1>อ่าน SKU และจำนวนจากภาพออเดอร์</h1>
  <section id="drop">
    <div class="grow"><strong>วางภาพออเดอร์ที่นี่ ได้หลายรูป</strong><span>รองรับ WARRIX, Grand Sport, PEGAN และ EGO กด Ctrl+V หรือลากไฟล์มาวาง รูปไม่ถูกส่งออกจากเครื่อง</span><small id="db-status"></small></div>
    <button id="pick" class="primary" type="button">เลือกหลายภาพ</button>
    <input id="file" type="file" accept="image/*" multiple hidden>
  </section>
  <section id="status" role="status" hidden><div id="status-text"></div><div id="bar"><div id="bar-fill"></div></div></section>
  <section id="result" hidden>
    <div class="summary">
      <span><b id="s-images">0</b> รูป</span>
      <span><b id="s-count">0</b> รายการ</span>
      <span>รวม <b id="s-total">0</b> ตัว</span>
      <span id="s-match"></span>
      <span id="s-flag"></span>
      <span id="s-missing" class="bad" hidden></span>
      <span id="s-failed" class="bad" hidden></span>
      <div class="actions">
        <label class="merge"><input id="merge" type="checkbox"><span id="merge-text">รวม SKU ซ้ำ</span></label>
        <button id="clear" type="button">ล้างทั้งหมด</button>
        <button id="csv" type="button">บันทึก CSV</button>
        <button id="copy" class="primary" type="button">คัดลอกไปวาง Excel</button>
      </div>
    </div>
    <div class="table"><table id="table">
      <thead><tr><th style="text-align:right">#</th><th>ในภาพ</th><th>SKU</th><th>จำนวน</th><th>สถานะ</th></tr></thead>
    </table></div>
  </section>
</main>
<div id="toast" role="status" hidden></div>

    // ฐานมีสองชื่อ (WH, BK) ผู้ใช้เลือกใช้ชื่อไทยเป็นหลัก
    'EG6197:074': 'ขาว สโนว์', 'EG9011A:01': 'ดำ',
    // EG9066 สี NV ในใบ ผู้ใช้ยืนยันว่าเป็น กรม (ฐานมีทั้ง กรม และ น้ำเงิน)
    'EG9066:510': 'กรม',
  };
  // เลขไซซ์ที่ซ่อนในรหัส EGO
  const EGO_SIZE = { 1: 'XL', 2: 'L', 3: 'M', 4: '3L', 5: '2L', 6: 'S', 8: 'SS' };
  const gtinKey = g => String(g || '').toUpperCase().replace(/[^A-Z0-9]/g, '').replace(/^0+/, '');
  // สีเดียวกันแต่ฐานมี SKU สองชื่อ ใช้ค่าตามใบก่อนและเตือนจนกว่าผู้ใช้จะเลือก
  const EGO_TWIN = {};
  const digit = c => TO_DIGIT[c] || c;
  const letter = c => TO_LETTER[c] || c;
  const norm = s => String(s || '').trim().toUpperCase();
  const colorKey = s => String(s || '').replace(/[\s-]/g, '');
  const isThai = s => /[฀-๿]/.test(String(s || ''));

  // รุ่นยาว เช่น 262JKACL70 = เลข 3 ตัว + อักษร + เลข 2 ตัว
  // รุ่นสั้น เช่น PLA024, PLAN15 = อักษร 3 ตัว + ตัวกลาง + เลข 2 ตัว
  function fixModel(m) {
    const c = m.split('');
    if (c.length >= 9) {
      return c.map((x, i) => (i < 3 || i >= c.length - 2) ? digit(x) : letter(x)).join('');
    }
    if (c.length === 6) {
      return c.map((x, i) => {
        if (i < 3) return letter(x);
        if (i >= 4) return digit(x);
        return 'ODQ'.includes(x) ? '0' : letter(x);
      }).join('');
    }
    return m;
  }

  function fixSize(s) {
    if (SIZE_RE.test(s)) return s;
    return s.length === 2 && s[1] === 'L' ? digit(s[0]) + 'L' : s;
  }

  function parseSku(raw) {
    const s = String(raw || '').toUpperCase().replace(/[^A-Z0-9-]/g, '');
    const m = s.match(/W[A-Z]-[A-Z0-9]{4,}-[A-Z0-9]{1,3}-[A-Z0-9]{1,4}$/);
    if (!m) return null;
    const [prefix, model, color, size] = m[0].split('-');
    return { prefix, model: fixModel(model), color, size: fixSize(size) };
  }

  function rank(values) {
    const n = new Map();
    values.forEach(v => n.set(v, (n.get(v) || 0) + 1));
    return [...n.entries()].sort((a, b) => b[1] - a[1]);
  }

  function top(values) {
    const r = rank(values);
    if (!r.length) return { value: '', share: 0, tied: false };
    return { value: r[0][0], share: r[0][1] / values.length, tied: r.length > 1 && r[0][1] === r[1][1] };
  }

  function voteSku(reads) {
    const parsed = reads.map(parseSku).filter(Boolean);
    if (!parsed.length) return { sku: '', sure: false, reads: 0, share: 0, alts: [], ranked: [] };
    const parts = ['prefix', 'model', 'color', 'size'].map(k => top(parsed.map(p => p[k])));
    const share = Math.min(...parts.map(p => p.share));
    const sku = parts.map(p => p.value).join('-');
    // รหัสสีไม่มีรูปแบบให้แก้ตัวคล้าย (เช่น R9/RS/R3) จึงต้องอ่านตรงกันทุกรอบ
    const sure = parsed.length >= 3 && share >= SURE_SHARE && parts[2].share === 1 && !parts.some(p => p.tied) && SIZE_RE.test(parts[3].value);
    const whole = rank(parsed.map(p => [p.prefix, p.model, p.color, p.size].join('-')));
    const alts = [sku, ...whole.map(x => x[0]).filter(x => x !== sku)].slice(0, 4);
    return { sku, sure, reads: parsed.length, share, alts, ranked: whole.map(([s, count]) => ({ sku: s, count })) };
  }

  function voteQty(reads) {
    const clean = reads.map(r => String(r || '').replace(/\D/g, '')).filter(Boolean);
    if (!clean.length) return { qty: '', sure: false };
    const t = top(clean);
    return { qty: t.value, sure: clean.length === reads.length && t.share === 1 };
  }

  // แต่ละบรรทัดเป็น "SKU" หรือ "SKU<tab>GTIN" (GTIN ของ EGO คือรหัสในใบ เช่น TT50012133)
  function makeCatalog(list) {
    const map = new Map(), colors = new Map(), models = new Map(), gtins = new Map(), learnt = new Map();
    for (const raw of list) {
      const [skuRaw, gtinRaw] = String(raw || '').split('\t');
      const sku = String(skuRaw || '').trim();
      if (!sku) continue;
      if (gtinRaw && gtinKey(gtinRaw)) {
        gtins.set(gtinKey(gtinRaw), sku);
        const p = parseEgoCode(gtinRaw) || parseEgoCode('0' + gtinRaw);
        const parts = sku.split('-');
        if (p && parts[0] === p.model && parts.length >= 3) {
          const color = parts.slice(1, -1).join('-');
          [`${p.model}:${p.colorCode}`, p.model.startsWith('TT') ? `TT:${p.colorCode}` : ''].filter(Boolean).forEach(k => {
            if (!learnt.has(k)) learnt.set(k, new Set());
            learnt.get(k).add(color);
          });
        }
      }
      const up = norm(sku);
      if (!map.has(up)) map.set(up, sku);
      const w = up.match(/^(W[A-Z])-([A-Z0-9]+)-/);
      if (w) {
        if (!models.has(w[1])) models.set(w[1], new Set());
        models.get(w[1]).add(w[2]);
      }
      const m = sku.match(/^(\d{6}|TT\d{3}|EG\d{4}[A-Z]?)-(.+)-([^-]+)$/);
      if (m) {
        if (!colors.has(m[1])) colors.set(m[1], new Set());
        colors.get(m[1]).add(m[2]);
      }
    }
    // เลขสีที่เรียนจาก GTIN ใช้ได้เฉพาะเลขที่ชี้ไปสีเดียว
    const derived = new Map([...learnt].filter(([, s]) => s.size === 1).map(([k, s]) => [k, [...s][0]]));
    return { size: map.size, map, colors, models, gtins, derived, has: s => map.has(norm(s)), get: s => map.get(norm(s)) || '' };
  }

  function distance(a, b, max) {
    if (Math.abs(a.length - b.length) > max) return max + 1;
    let prev = Array.from({ length: b.length + 1 }, (_, i) => i);
    for (let i = 1; i <= a.length; i++) {
      const cur = [i];
      let low = i;
      for (let j = 1; j <= b.length; j++) {
        cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
        if (cur[j] < low) low = cur[j];
      }
      if (low > max) return max + 1;
      prev = cur;
    }
    return prev[b.length];
  }

  function nearest(sku, cat, max) {
    const key = norm(sku);
    if (!key) return [];
    const hits = [];
    for (const [up, original] of cat.map) {
      if (up[0] !== key[0] || up[1] !== key[1]) continue;
      const d = distance(key, up, max);
      if (d <= max) hits.push({ sku: original, d });
    }
    hits.sort((a, b) => a.d - b.d);
    const best = hits.length ? hits[0].d : 0;
    return hits.filter(x => x.d === best).slice(0, 4).map(x => x.sku);
  }

  // ชื่อสินค้ามักมีรหัสที่ตรงฐาน เช่น รหัส WP-FBA009 แต่ชื่อเขียน WP-1509-น้ำเงิน-B9-M
  function modelFromName(texts, prefix, cat) {
    const known = cat.models.get(prefix);
    if (!known) return { model: '', count: 0 };
    const short = [...known].filter(m => m.length <= 5);
    const counts = new Map();
    texts.forEach(text => {
      const re = /W[A-Z]-([A-Z0-9]{4,5})(?![A-Z0-9])/g;
      const up = String(text || '').toUpperCase();
      let m;
      const seen = new Set();
      while ((m = re.exec(up))) {
        const hits = short.filter(k => looks(k) === looks(m[1]));
        if (hits.length === 1 && !seen.has(hits[0])) {
          seen.add(hits[0]);
          counts.set(hits[0], (counts.get(hits[0]) || 0) + 1);
        }
      }
    });
    const best = [...counts].sort((a, b) => b[1] - a[1]);
    return best.length ? { model: best[0][0], count: best[0][1] } : { model: '', count: 0 };
  }

  function aliasSku(sku, cat, fromName) {
    const p = String(sku || '').split('-');
    const known = cat.models.get(p[0]);
    if (p.length < 2 || (known && known.has(p[1]))) return p.join('-');
    const key = Object.keys(MODEL_ALIAS).find(k => looks(k) === looks(p[1]));
    if (key) p[1] = MODEL_ALIAS[key];
    else if (fromName.model) p[1] = fromName.model;
    return p.join('-');
  }

  function resolveWarrix(vote, cat, nameTexts) {
    const prefix = String(vote.sku || '').split('-')[0];
    const fromName = modelFromName(nameTexts || [], prefix, cat);
    const merged = new Map();
    vote.ranked.forEach(x => { const s = aliasSku(x.sku, cat, fromName); merged.set(s, (merged.get(s) || 0) + x.count); });
    const ranked = [...merged].map(([sku, count]) => ({ sku, count })).sort((a, b) => b.count - a.count);
    const voted = aliasSku(vote.sku, cat, fromName);
    const valid = ranked.filter(x => cat.has(x.sku));
    if (!valid.length) {
      // ไม่เปลี่ยนเป็น SKU ใกล้เคียงให้เอง เพราะอาจเป็นคนละไซซ์ ให้ผู้ใช้กดเลือกแทน
      const near = nearest(voted, cat, 2);
      return { sku: voted, sure: false, alts: [voted, ...near.filter(x => x !== voted)].slice(0, 4) };
    }
    const first = valid[0], second = valid[1];
    const sure = first.count >= 2 && (!second || first.count >= second.count * 2);
    const sku = cat.get(first.sku);
    return { sku, sure, alts: [sku, ...valid.slice(1).map(x => cat.get(x.sku))].slice(0, 4) };
  }

  function matchColor(model, name, cat) {
    const options = cat.colors.get(model);
    if (!options || !name) return '';
    const key = colorKey(name);
    return [...options].find(x => colorKey(x) === key) || '';
  }

  function parseDocSize(raw) {
    let s = String(raw || '').toUpperCase().replace(/[^XSML0-9]/g, '');
    if (s === '5') s = 'S';
    if (s === 'X5') s = 'XS';
    // ไซซ์เอียงอย่าง 2XL มักอ่านได้แค่ตัวเลข และฐานของใบสั่งนี้ใช้แบบ nXL เท่านั้น
    if (/^[2-9]X?L?$/.test(s)) s = `${s[0]}XL`;
    return DOC_SIZE_RE.test(s) ? s : '';
  }

  function resolveDoc(input, colorMap, cat) {
    const models = input.modelReads.map(x => String(x).replace(/\D/g, '')).filter(x => x.length === 6);
    const m = top(models);
    let model = m.value;
    let modelOk = m.share >= 0.6 && cat.colors.has(model);
    if (model && !cat.colors.has(model)) {
      const close = [...cat.colors.keys()].filter(k => distance(k, model, 1) === 1);
      if (close.length === 1) model = close[0];
      modelOk = false;
    }
    const codes = input.colorReads.map(x => String(x).replace(/\D/g, '')).filter(x => x.length === 4);
    const c = top(codes);
    const colorName = matchColor(model, colorMap[`${model}:${c.value}`] || colorMap[c.value], cat);
    const size = input.size || '';
    const built = colorName && size ? `${model}-${colorName}-${size}` : [model, c.value, size].filter(Boolean).join('-');
    const found = cat.has(built);
    return {
      sku: found ? cat.get(built) : built,
      sure: modelOk && c.share >= 0.75 && !c.tied && found,
      model, colorCode: c.value, colorName, size,
      options: [...(cat.colors.get(model) || [])].sort((a, b) => a.localeCompare(b, 'th')),
    };
  }

  // PEGAN: ในภาพเขียน 16-25085 NV 5L แต่ในฐานเป็น 1625085-NV-5L
  function parsePegan(raw) {
    const s = String(raw || '').toUpperCase().replace(/\s/g, '').replace(/[^A-Z0-9/-]/g, '');
    const m = s.match(/^([0-9A-Z]{2})-?([0-9A-Z]{5})([A-Z0-9]{2})(?:[/I1L]([A-Z0-9]{2}))?((?:[2-9]|Z)?(?:XS|SS|XL|S|M|L))$/);
    if (!m) return '';
    const code = (m[1] + m[2]).split('').map(digit).join('');
    if (!/^\d{7}$/.test(code)) return '';
    const fix = x => x.split('').map(letter).join('');
    const color = m[4] ? `${fix(m[3])}/${fix(m[4])}` : fix(m[3]);
    return `${code}-${color}-${m[5].replace(/^Z/, '2')}`;
  }

  function resolvePegan(reads, cat) {
    const parsed = reads.map(parsePegan).filter(Boolean);
    if (!parsed.length) return { sku: '', sure: false, alts: [] };
    const ranked = rank(parsed);
    const valid = ranked.filter(([s]) => cat.has(s));
    const list = ranked.map(x => cat.get(x[0]) || x[0]);
    // ถ้าอ่านส่วนใหญ่เป็น SKU ที่ไม่มีในฐาน ต้องคงค่านั้นไว้ ห้ามเลื่อนไปไซซ์ที่มีในฐาน
    if (!valid.length || (!cat.has(ranked[0][0]) && ranked[0][1] > valid[0][1])) {
      return { sku: ranked[0][0], sure: false, alts: list.slice(0, 4) };
    }
    const sku = cat.get(valid[0][0]);
    const sure = valid[0][1] >= 2 && (!valid[1] || valid[0][1] >= valid[1][1] * 2) && ranked[0][1] === valid[0][1];
    return { sku, sure, alts: [sku, ...list.filter(x => x !== sku)].slice(0, 4) };
  }

  // EGO: TT50013133 = TT001 ไซซ์ 3 สี 133, 05102212004 = EG1022 ไซซ์ 2 สี 004, 069011A501 = EG9011A ไซซ์ 5 สี 01
  function parseEgoCode(raw) {
    const s = String(raw || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
    // ตัว TT ติดกันมักถูกอ่านเป็น T1 หรือ 11
    if (/^[T1IL7]{2}/.test(s)) {
      const m = s.slice(2).split('').map(digit).join('').match(/^50(\d{2})(\d)(\d{2,3})$/);
      if (m) return { model: `TT0${m[1]}`, sizeDigit: m[2], colorCode: m[3], key: `TT50${m[1]}${m[2]}${m[3]}` };
    }
    const d = s.split('').map(c => c === 'A' ? c : digit(c)).join('');
    const e5 = d.match(/^05(\d{4})(\d)(\d)(\d{2,3})$/);
    if (e5) return { model: `EG${e5[1]}`, sizeDigit: e5[3], colorCode: e5[4], key: `5${e5[1]}${e5[2]}${e5[3]}${e5[4]}` };
    // 069011A501 = EG9011A, 0690665510 = EG9066 (บางรุ่นไม่มีตัวอักษรท้ายรุ่น)
    const e6 = d.match(/^06(\d{4}A?)(\d)(\d{2,3})$/);
    return e6 ? { model: `EG${e6[1]}`, sizeDigit: e6[2], colorCode: e6[3], key: `6${e6[1]}${e6[2]}${e6[3]}` } : null;
  }

  function descSize(text) {
    const m = String(text || '').toUpperCase().replace(/\s/g, '').match(/\((SS|XS|S|M|L|XL|[2-9]L)\)/);
    return m ? m[1] : '';
  }

  // ซ่อนสีอังกฤษเฉพาะเมื่อไซซ์เดียวกันมี SKU ไทยในฐานแล้ว (BL ไม่รวม เพราะอาจเป็นน้ำเงินหรือฟ้า)
  const EN_FAMILY = { BK: 'ดำ', NV: 'กรม', WH: 'ขาว', RD: 'แดง' };
  function egoOptions(model, size, cat) {
    const all = [...(cat.colors.get(model) || [])];
    const thai = all.filter(isThai);
    return all.filter(c => {
      if (isThai(c)) return true;
      const family = EN_FAMILY[c];
      return !(family && size && thai.some(t => t.startsWith(family) && cat.has(`${model}-${t}-${size}`)));
    }).sort((a, b) => a.localeCompare(b, 'th'));
  }

  function resolveEgo(codeReads, descReads, colorMap, cat) {
    const fromDesc = top(descReads.map(descSize).filter(Boolean)).value;
    // ① รหัสในใบตรงกับ GTIN ในฐาน = ได้ SKU ตรงตัว
    const hits = codeReads.map(r => { const p = parseEgoCode(r); return (p && cat.gtins.get(p.key)) || cat.gtins.get(gtinKey(r)); }).filter(Boolean);
    if (hits.length) {
      const g = top(hits);
      const parts = g.value.split('-');
      const gModel = parts[0], gSize = parts[parts.length - 1], gColor = parts.slice(1, -1).join('-');
      const p = codeReads.map(parseEgoCode).find(Boolean);
      return {
        sku: g.value,
        sure: hits.length >= 2 && g.share >= 0.6 && !g.tied && (!fromDesc || fromDesc === gSize),
        alts: [g.value],
        meta: { model: gModel, colorCode: p ? p.colorCode : '', colorName: gColor, size: gSize, options: egoOptions(gModel, gSize, cat) },
      };
    }
    const parsed = codeReads.map(parseEgoCode).filter(Boolean);
    if (!parsed.length) return null;
    const t = top(parsed.map(p => `${p.model}|${p.sizeDigit}|${p.colorCode}`));
    const [model, sizeDigit, colorCode] = t.value.split('|');
    const size = EGO_SIZE[sizeDigit] || fromDesc;
    const key = `${model}:${colorCode}`;
    const learned = colorMap[key];
    const twin = EGO_TWIN[key];
    const family = model.startsWith('TT') ? `TT:${colorCode}` : key;
    // ยึดตามฐาน: ใช้สีไทยเมื่อไซซ์นั้นมีในฐาน ถ้าฐานมีแต่ชื่ออังกฤษจึงใช้ชื่อนั้น
    const options = egoOptions(model, size, cat);
    let colorName = [learned, twin && twin[0], COLOR_SEED[key], cat.derived.get(key), COLOR_SEED[family], cat.derived.get(family)]
      .map(c => matchColor(model, c, cat)).find(c => c && options.includes(c)) || '';
    // ② ยังไม่รู้เลขสี: ใช้รหัสสีอังกฤษในรายละเอียด (เช่น สีNV(2L)) เป็นคำแนะนำ แต่ต้องให้ตรวจ
    let hinted = false;
    if (!colorName) {
      const tok = descReads.map(x => (String(x).toUpperCase().replace(/\s/g, '').match(/([A-Z]{2})\((?:SS|XS|S|M|L|XL|[2-9]L)\)/) || [])[1]).find(x => EN_FAMILY[x]);
      const fam = tok && EN_FAMILY[tok];
      const pick = fam && (options.find(o => o === fam) || options.find(o => o.startsWith(fam)));
      if (pick) { colorName = pick; hinted = true; }
    }
    const built = colorName && size ? `${model}-${colorName}-${size}` : [model, colorCode, size].filter(Boolean).join('-');
    const found = cat.has(built);
    const sku = found ? cat.get(built) : built;
    const other = !learned && twin && size ? cat.get(`${model}-${twin[1]}-${size}`) : '';
    return {
      sku,
      sure: found && !hinted && t.share >= 0.6 && !t.tied && !other && (!fromDesc || fromDesc === size),
      alts: other ? [sku, other] : [sku],
      meta: { model, colorCode, colorName, size, options },
    };
  }

  function parseMoney(raw) {
    const s = String(raw || '').replace(/[^\d.]/g, '');
    if (!s) return null;
    const m = s.match(/(\d+)\.(\d{1,2})/);
    if (m) return parseFloat(`${m[1]}.${m[2]}`);
    return s.length >= 3 ? parseInt(s, 10) / 100 : null;
  }

  function voteNumber(values) {
    const clean = values.filter(v => v !== null && !isNaN(v));
    return clean.length ? Number(top(clean.map(String)).value) : null;
  }

  const lineMatches = (qty, price, discount, amount) => Math.abs(qty * price * (1 - discount / 100) - amount) <= 0.02;

  function qtyFromAmount(price, discount, amount) {
    const unit = price * (1 - discount / 100);
    if (!(unit > 0)) return null;
    const q = Math.round(amount / unit);
    return q >= 1 && lineMatches(q, price, discount, amount) ? q : null;
  }

  const api = { parseSku, voteSku, voteQty, makeCatalog, nearest, resolveWarrix, resolveDoc, matchColor, parseDocSize, isThai, parsePegan, resolvePegan, parseEgoCode, resolveEgo, parseMoney, voteNumber, lineMatches, qtyFromAmount, COLOR_SEED };
  if (typeof module !== 'undefined') module.exports = api; else root.SkuCore = api;
})(this);
</script>
<script>(function () {
  'use strict';
  const $ = id => document.getElementById(id);
  const SKU_CHARS = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789- ';
  const ROW_HEIGHT = 37.8; // ความสูงแถวของหน้าออเดอร์ที่ซูม 100%
  const MIN_ZOOM = 0.9; // เล็กกว่านี้ตัวอักษรแตกจนเชื่อผลไม่ได้
  const SCALES = [2, 3, 4, 5, 6];
  const QTY_SCALES = [3, 4, 6];
  let workerPromise = null;
  let lastChars = null;
  let pumping = false;
  const DOC_SCALES = [3, 4, 5, 6];
  const DOC_ROW = 53.44; // ความสูงแถวของใบสั่งในภาพกว้างปกติ
  const DOC_CELL = 55; // ความกว้างช่องไซซ์
  const COLOR_KEY = 'warrix-sku-reader.colors';
  let groups = []; // หนึ่งกลุ่มต่อหนึ่งรูป: { state: wait | read | done | error, rows, footerReads, ... }
  const DB = JSON.parse($('d-config').textContent);
  let catalog = SkuCore.makeCatalog(decodeCatalog());
  const colorMap = loadColors();
  let catalogReady = Promise.resolve();

  function decodeCatalog() {
    const el = $('d-catalog');
    const bin = atob(el.textContent.trim());
    const out = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
    el.remove();
    return new TextDecoder().decode(out).split('\n');
  }

  function loadColors() {
    const base = Object.assign({}, SkuCore.COLOR_SEED);
    try {
      Object.assign(base, JSON.parse(localStorage.getItem(COLOR_KEY) || '{}'));
    } catch (e) { /* ใช้ค่าเริ่มต้น */ }
    return base;
  }

  // เลขสีเดียวกันอาจชื่อต่างกันในแต่ละรุ่น จึงจำแยกตามรุ่น
  function saveColor(model, code, name) {
    const key = `${model}:${code}`;
    colorMap[key] = name;
    try {
      const saved = JSON.parse(localStorage.getItem(COLOR_KEY) || '{}');
      saved[key] = name;
      localStorage.setItem(COLOR_KEY, JSON.stringify(saved));
    } catch (e) { /* จำไม่ได้ก็ยังใช้ต่อในรอบนี้ */ }
  }

  function setDbStatus(text, warn) {
    $('db-status').textContent = text;
    $('db-status').classList.toggle('warn', !!warn);
  }

  // โหลดฐานล่าสุด ถ้าไม่มีเน็ตหรือโหลดไม่ครบ จะใช้สำเนาในไฟล์ต่อ
  async function refreshCatalog() {
    // รุ่นสาธารณะไม่มีคีย์ฐาน จึงใช้รายการ SKU ที่ฝังในไฟล์เท่านั้น
    if (!DB.key) {
      if (DB.assets) {
        setDbStatus('กำลังโหลดรายการ SKU');
        try {
          const r = await fetch('catalog.txt');
          if (!r.ok) throw new Error(String(r.status));
          catalog = SkuCore.makeCatalog((await r.text()).split('\n'));
        } catch (e) {
          setDbStatus('โหลดรายการ SKU ไม่สำเร็จ กรุณารีเฟรชหน้านี้', true);
          return;
        }
      }
      setDbStatus(`ฐาน SKU ${catalog.size.toLocaleString('en-US')} รายการ ข้อมูลวันที่ ${DB.date}`);
      if (groups.length) paint();
      return;
    }
    setDbStatus(`กำลังอัปเดตฐาน SKU (ตอนนี้มี ${catalog.size.toLocaleString('en-US')} รายการ)`);
    const ctl = new AbortController();
    const timer = setTimeout(() => ctl.abort(), 20000);
    const headers = { apikey: DB.key, Authorization: `Bearer ${DB.key}` };
    const page = (offset, extra) => fetch(`${DB.url}/rest/v1/products?select=sku_merchant,gtin&order=id.asc&limit=1000&offset=${offset}`, { headers: Object.assign({}, headers, extra), signal: ctl.signal });
    const line = r => r.gtin && /^(TT|EG)/i.test(r.sku_merchant || '') ? `${r.sku_merchant}\t${r.gtin}` : r.sku_merchant;
    try {
      const first = await page(0, { Prefer: 'count=exact' });
      if (!first.ok) throw new Error(String(first.status));
      const total = parseInt((first.headers.get('content-range') || '').split('/')[1], 10);
      if (!total) throw new Error('no count');
      const list = (await first.json()).map(line);
      const offsets = [];
      for (let o = 1000; o < total; o += 1000) offsets.push(o);
      const results = [];
      await Promise.all([0, 1, 2, 3].map(async () => {
        while (offsets.length) {
          const o = offsets.shift();
          const r = await page(o);
          if (!r.ok) throw new Error(String(r.status));
          results.push(await r.json());
        }
      }));
      results.forEach(p => p.forEach(r => list.push(line(r))));
      if (list.length !== total) throw new Error('incomplete');
      catalog = SkuCore.makeCatalog(list);
      setDbStatus(`ฐาน SKU ล่าสุด ${catalog.size.toLocaleString('en-US')} รายการ`);
      if (groups.length) paint();
    } catch (e) {
      setDbStatus(`ใช้ฐาน SKU สำรอง ${catalog.size.toLocaleString('en-US')} รายการ จากวันที่ ${DB.date} เพราะเชื่อมต่อฐานจริงไม่ได้`, true);
    } finally {
      clearTimeout(timer);
    }
  }

  function bytes(id) {
    const el = $(id);
    const bin = atob(el.textContent.trim());
    const out = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
    el.remove();
    return out;
  }

  function getWorker() {
    if (!workerPromise) {
      workerPromise = (async () => {
        // ฝังข้อมูลภาษาไว้ในตัว worker: คำขอไปที่ LANG_URL ไม่ออกเน็ต แต่ตอบจากไฟล์นี้เอง
        const LANG_URL = 'https://embedded.local/tessdata';
        if (DB.assets) {
          // รุ่นเว็บ: โหลดตัวอ่านจากไฟล์ข้าง ๆ หน้านี้ ไม่ส่งรูปออกไปไหน
          const base = new URL('.', location.href).href;
          const load = async n => { const r = await fetch(base + n); if (!r.ok) throw new Error(n); return r.arrayBuffer(); };
          const [core, work] = await Promise.all([load('core.js'), load('worker.js')]);
          const shim = `(function(){var p=${JSON.stringify(DB.assets.map(n => base + n))},f=self.fetch.bind(self);` +
            `self.fetch=function(r,o){if(String(r).indexOf("${LANG_URL}")!==0)return f(r,o);` +
            'return Promise.all(p.map(function(u){return f(u).then(function(x){if(!x.ok)throw new Error(u);return x.arrayBuffer()})}))' +
            '.then(function(a){var n=a.reduce(function(s,b){return s+b.byteLength},0),t=new Uint8Array(n),i=0;' +
            'a.forEach(function(b){t.set(new Uint8Array(b),i);i+=b.byteLength});return new Response(t)})}})();\n';
          const webBlob = new Blob([core, '\n', shim, work], { type: 'text/javascript' });
          return Tesseract.createWorker('eng', 1, {
            workerPath: URL.createObjectURL(webBlob), workerBlobURL: false, corePath: 'embedded.js',
            langPath: LANG_URL, cacheMethod: 'none', gzip: true,
          }, { load_system_dawg: '0', load_freq_dawg: '0' });
        }
        const engEl = $('d-eng');
        const eng = engEl.textContent.trim();
        engEl.remove();
        const shimHead = '(function(){var b=atob("';
        const shimTail = '"),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);' +
          'var f=self.fetch.bind(self);self.fetch=function(r,o){return String(r).indexOf("' + LANG_URL +
          '")===0?Promise.resolve(new Response(u.slice())):f(r,o)}})();\n';
        const blob = new Blob([bytes('d-core'), '\n', shimHead, eng, shimTail, bytes('d-worker')], { type: 'text/javascript' });
        return Tesseract.createWorker('eng', 1, {
          workerPath: URL.createObjectURL(blob), workerBlobURL: false, corePath: 'embedded.js',
          langPath: LANG_URL, cacheMethod: 'none', gzip: true,
        }, { load_system_dawg: '0', load_freq_dawg: '0' });
      })();
    }
    return workerPromise;
  }

  // หาแถวจากปุ่มถังขยะสีแดง และหาช่องจำนวนจากกรอบ input
  function detectLayout(canvas) {
    const W = canvas.width, H = canvas.height;
    const d = canvas.getContext('2d', { willReadFrequently: true }).getImageData(0, 0, W, H).data;
    const px = (x, y) => (y * W + x) * 4;
    const isRed = (x, y) => { const i = px(x, y), r = d[i], g = d[i + 1], b = d[i + 2]; return r > 165 && g < 115 && b < 105 && r - g > 70; };
    const lum = (x, y) => { const i = px(x, y); return d[i] * 0.299 + d[i + 1] * 0.587 + d[i + 2] * 0.114; };

    // ปุ่มถังขยะอยู่ซ้าย (หน้าออเดอร์ WO) หรือขวา (หน้า WL)
    // รูปสินค้าสีแดง (เช่นเสื้อแดง) ก็นับเป็นแถบแดงได้ จึงหาคอลัมน์ที่ดีที่สุดแยกแต่ละฝั่ง แล้วลองทีละฝั่งจนเจอตารางจริง
    const bestIn = (from, to) => {
      let best = null;
      for (let x = from; x < to; x++) {
        const runs = [];
        let start = -1, gap = 0;
        for (let y = 0; y < H; y++) {
          if (isRed(x, y)) { if (start < 0) start = y; gap = 0; }
          else if (start >= 0 && ++gap > 12) { const end = y - gap; if (end - start >= 6 && end - start <= 60) runs.push((start + end) / 2); start = -1; gap = 0; }
        }
        if (!best || runs.length > best.runs.length) best = { x, runs };
      }
      return best && best.runs.length ? best : null;
    };
    const cands = [bestIn(0, Math.floor(W * 0.25)), bestIn(Math.floor(W * 0.75), W)].filter(Boolean)
      .sort((a, b) => b.runs.length - a.runs.length);
    for (const best of cands) {
      const r = layoutFrom(best);
      if (r) return r;
    }
    return null;

    function layoutFrom(best) {
    const coarse = best.runs.slice(1).map((y, i) => y - best.runs[i]).sort((a, b) => a - b);
    const coarseGap = coarse.length ? coarse[Math.floor(coarse.length / 2)] : ROW_HEIGHT;
    const k0 = coarseGap / ROW_HEIGHT;

    // คอลัมน์เดียวอาจตัดผ่านลายถังขยะสีขาว จึงวัดทั้งปุ่มเพื่อให้ได้จุดกึ่งกลางจริง
    const half = Math.ceil(14 * k0);
    const bandL = Math.max(0, best.x - half), bandR = Math.min(W - 1, best.x + half);
    const minCount = Math.max(3, 4 * k0), maxGap = Math.ceil(3 * k0);
    const ys = [];
    let minX = W, maxX = 0, runStart = -1, runEnd = -1;
    const closeRun = () => {
      const h = runEnd - runStart + 1;
      if (runStart >= 0 && h >= 8 * k0 && h <= 28 * k0) {
        ys.push((runStart + runEnd) / 2);
        for (let y = runStart; y <= runEnd; y++) for (let x = bandL; x <= bandR; x++) if (isRed(x, y)) { if (x < minX) minX = x; if (x > maxX) maxX = x; }
      }
      runStart = -1;
    };
    for (let y = 0; y < H; y++) {
      let n = 0;
      for (let x = bandL; x <= bandR; x++) if (isRed(x, y)) n++;
      if (n >= minCount) { if (runStart < 0) runStart = y; runEnd = y; }
      else if (runStart >= 0 && y - runEnd > maxGap) closeRun();
    }
    closeRun();
    if (!ys.length) return null;
    const avgGap = ys.length > 1 ? (ys[ys.length - 1] - ys[0]) / (ys.length - 1) : coarseGap;
    const spacing = Math.abs(avgGap - coarseGap) <= coarseGap * 0.05 ? avgGap : coarseGap;
    const k = spacing / ROW_HEIGHT;
    const btnX = (minX + maxX) / 2;
    if (btnX > W / 2) return { type: 'list', ys, spacing, btnX, W, H };

    const reach = Math.max(3, Math.round(8 * k)); // สูงกว่าตัวเลขในช่อง เส้นตัวเลขจึงไม่ถูกนับเป็นกรอบ
    const off = Math.max(2, Math.round(2 * k));
    const profile = new Int32Array(W);
    for (let x = Math.floor(W * 0.5); x < W - off; x++) {
      for (const yc of ys) {
        let hit = 0, total = 0;
        for (let y = Math.round(yc - reach); y <= yc + reach; y++) {
          if (y < 0 || y >= H) continue;
          total++;
          const v = lum(x, y);
          if (v < lum(x - off, y) - 5 || v < lum(x + off, y) - 5) hit++;
        }
        if (total && hit / total >= 0.8) profile[x]++;
      }
    }
    const peaks = [];
    for (let x = 0; x < W; x++) {
      if (profile[x] >= ys.length * 0.5) {
        let e = x, top = profile[x];
        while (e + 1 < W && profile[e + 1] >= ys.length * 0.5) { e++; top = Math.max(top, profile[e]); }
        peaks.push({ x: (x + e) / 2, score: top });
        x = e;
      }
    }
    let box = null;
    for (let i = 0; i < peaks.length; i++) for (let j = i + 1; j < peaks.length; j++) {
      const w = peaks[j].x - peaks[i].x;
      if (w >= 50 * k && w <= 85 * k) {
        const score = peaks[i].score + peaks[j].score;
        if (!box || score > box.score) box = { a: peaks[i].x, b: peaks[j].x, score };
      }
    }
    if (!box) return null;
    return { ys, k, btnX, qtyA: box.a, qtyB: box.b, W, H };
    }
  }

  // หน้า WARRIX แบบ WL: ถังขยะอยู่ขวา จำนวนเป็นตัวเลขธรรมดา ตำแหน่งคอลัมน์คิดเป็นสัดส่วนจากปุ่มถังขยะ
  async function readList(g, src, L) {
    const worker = await getWorker();
    const T = L.btnX, row = L.spacing, k = row / 33.6;
    const lowRes = k < MIN_ZOOM;
    const money = async b => SkuCore.voteNumber((await (async () => {
      const out = [];
      for (const s of QTY_SCALES) out.push(SkuCore.parseMoney(await ocr(worker, cropCanvas(src, b.x, b.y, b.w, b.h, s / k, true), '0123456789.,')));
      return out;
    })()));
    const out = [];
    for (let i = 0; i < L.ys.length; i++) {
      if (g.cancelled) return;
      const y = L.ys[i];
      showProgress(g, `แถว ${i + 1} จาก ${L.ys.length}`, 0.08 + 0.88 * i / L.ys.length);
      const top = y - row * 0.3, h = row * 0.6;
      const skuBox = { x: T * 0.105, y: top, w: T * 0.145, h };
      const nameBox = { x: T * 0.255, y: top, w: T * 0.27, h };
      const reads = [], nameTexts = [];
      for (const s of SCALES) {
        reads.push((await ocr(worker, cropCanvas(src, skuBox.x, skuBox.y, skuBox.w, skuBox.h, s / k, true), SKU_CHARS)).replace(/\s/g, ''));
        const nameText = await ocr(worker, cropCanvas(src, nameBox.x, nameBox.y, nameBox.w, nameBox.h, s / k, true), SKU_CHARS);
        nameTexts.push(nameText);
        const token = nameText.trim().split(/\s+/).filter(t => /^W[A-Z]-/.test(t)).pop();
        if (token) reads.push(token);
      }
      const qtyBox = inkBox(src, { x: T * 0.6, y: top, w: T * 0.11, h }, k);
      const qReads = [];
      for (const s of QTY_SCALES) qReads.push((await ocr(worker, cropCanvas(src, qtyBox.x, qtyBox.y, qtyBox.w, qtyBox.h, s / k, true), '0123456789')).replace(/\s/g, ''));
      const qtyRead = SkuCore.voteQty(qReads);
      const price = await money(inkBox(src, { x: T * 0.5, y: top, w: T * 0.08, h }, k));
      const amount = await money(inkBox(src, { x: T * 0.86, y: top, w: T * 0.1, h }, k));
      let qty = qtyRead.qty, qtySure = false;
      if (price !== null && amount !== null) {
        const fromAmount = SkuCore.qtyFromAmount(price, 0, amount);
        if (qty && SkuCore.lineMatches(Number(qty), price, 0, amount)) qtySure = true;
        else if (fromAmount) { qty = String(fromAmount); qtySure = false; }
      }
      const sku = SkuCore.resolveWarrix(SkuCore.voteSku(reads), catalog, nameTexts);
      out.push({
        sku: sku.sku, qty, skuSure: sku.sure && !lowRes, qtySure: qtySure && !lowRes, alts: sku.alts, checked: false,
        skuImg: preview(src, skuBox.x, skuBox.y, skuBox.w, skuBox.h, 28), qtyImg: preview(src, qtyBox.x, qtyBox.y, qtyBox.w, qtyBox.h, 28),
      });
    }
    if (g.cancelled) return;
    showProgress(g, 'กำลังอ่านยอดรวมในภาพ', 0.97);
    const footerReads = [], footerAlt = [];
    const fy = L.ys[L.ys.length - 1] + row * 0.55;
    if (fy + row * 0.7 < L.H) {
      const box = inkBox(src, { x: T * 0.9, y: fy, w: T * 0.065, h: row * 0.7 }, k);
      for (const mode of [true, 'bin']) for (const s of QTY_SCALES) {
        const t = (await ocr(worker, cropCanvas(src, box.x, box.y, box.w, box.h, s / k, mode), '0123456789.')).replace(/[^\d.]/g, '');
        const m = t.match(/^(\d+)/);
        if (!m) continue;
        footerReads.push(parseInt(m[1], 10));
        if (!t.includes('.') && parseInt(m[1], 10) >= 100 && parseInt(m[1], 10) % 100 === 0) footerAlt.push(parseInt(m[1], 10) / 100);
      }
    }
    if (g.cancelled) return;
    g.rows = out;
    g.footerReads = footerReads;
    g.footerAlt = footerAlt;
    g.lowRes = lowRes;
    g.state = 'done';
    g.file = null;
    renderGroup(g);
    paint();
  }

  // ภาพใหญ่มาก (เช่น จอ 200%) เส้นกรอบจะฟุ้ง จึงย่อมาหาตำแหน่งก่อน แล้วอ่านจากภาพเต็ม
  function detectLayoutAnySize(src) {
    const direct = detectLayout(src);
    if (direct || src.width < 1800) return direct;
    const f = 1600 / src.width;
    const c = document.createElement('canvas');
    c.width = 1600;
    c.height = Math.round(src.height * f);
    const g = c.getContext('2d', { willReadFrequently: true });
    g.imageSmoothingQuality = 'high';
    g.drawImage(src, 0, 0, c.width, c.height);
    const s = detectLayout(c);
    if (!s) return null;
    if (s.type === 'list') return { type: 'list', ys: s.ys.map(y => y / f), spacing: s.spacing / f, btnX: s.btnX / f, W: src.width, H: src.height };
    return { ys: s.ys.map(y => y / f), k: s.k / f, btnX: s.btnX / f, qtyA: s.qtyA / f, qtyB: s.qtyB / f, W: src.width, H: src.height };
  }

  // ใบสั่งแบบพิมพ์: หาแถวจากเส้นคั่นแนวนอน และหาช่องไซซ์จากขีดแนวตั้ง
  function detectDoc(canvas) {
    const W = canvas.width, H = canvas.height;
    const d = canvas.getContext('2d', { willReadFrequently: true }).getImageData(0, 0, W, H).data;
    const lum = (x, y) => { const i = (y * W + x) * 4; return d[i] * 0.299 + d[i + 1] * 0.587 + d[i + 2] * 0.114; };
    const lines = [];
    for (let y = 0; y < H; y++) {
      let n = 0;
      for (let x = 0; x < W; x += 2) if (lum(x, y) < 190) n++;
      if (n * 2 > W * 0.6) {
        const last = lines[lines.length - 1];
        if (last && y - last.end <= 2) last.end = y; else lines.push({ start: y, end: y });
      }
    }
    if (lines.length < 2) return null;
    const columnCounts = (top, bottom) => {
      const c = new Int32Array(W);
      for (let x = 0; x < W; x++) for (let y = Math.max(0, top); y <= bottom; y++) if (lum(x, y) < 190) c[x]++;
      return c;
    };
    const barChain = (counts, limit, cell, tol) => {
      const peaks = [];
      for (let x = 0; x < W; x++) {
        if (counts[x] >= limit) {
          let e = x;
          while (e + 1 < W && counts[e + 1] >= limit) e++;
          peaks.push((x + e) / 2);
          x = e;
        }
      }
      let best = [];
      for (let i = 0; i < peaks.length; i++) {
        const chain = [peaks[i]];
        for (let j = i + 1; j < peaks.length; j++) {
          const delta = peaks[j] - chain[chain.length - 1];
          if (Math.abs(delta - cell) <= tol) chain.push(peaks[j]);
          else if (delta > cell + tol) break;
        }
        if (chain.length > best.length) best = chain;
      }
      return best;
    };
    // แถวสินค้าคือช่วงระหว่างเส้นที่มีขีดช่องไซซ์เรียงห่างเท่ากัน หัวเอกสารจึงไม่ถูกนับ
    const isItem = (top, bottom, cell) => barChain(columnCounts(top, bottom), (bottom - Math.max(0, top) + 1) * 0.2, cell, cell * 0.12).length >= 4;
    const items = [];
    for (let i = 0; i < lines.length - 1; i++) {
      const top = lines[i].end + 1, bottom = lines[i + 1].start - 1, h = bottom - top + 1;
      if (h < 28 || h > W * 0.2) continue;
      const gap = (lines[i + 1].start + lines[i + 1].end) / 2 - (lines[i].start + lines[i].end) / 2;
      if (isItem(top, bottom, gap * DOC_CELL / DOC_ROW)) items.push({ top, bottom, gap, above: i, below: i + 1 });
    }
    if (!items.length) return null;
    const gapList = items.map(r => r.gap).sort((a, b) => a - b);
    const rowGap = gapList[Math.floor(gapList.length / 2)];
    const k = rowGap / DOC_ROW;
    const cell = DOC_CELL * k;
    const rows = items.map(r => ({ top: r.top, bottom: r.bottom }));
    const lastItem = items[items.length - 1];
    let lastLine = lines[lastItem.below].end;

    // รูปที่ตัดมาอาจไม่มีเส้นบนของแถวแรก หรือเส้นล่างของแถวสุดท้าย
    if (items[0].above === 0 && lines[0].start >= rowGap * 0.6) {
      const top = Math.round(lines[0].start - rowGap) + 1, bottom = lines[0].start - 1;
      if (isItem(top, bottom, cell)) rows.unshift({ top, bottom });
    }
    if (lastItem.below === lines.length - 1 && H - 1 - lastLine >= rowGap * 0.6) {
      const top = lastLine + 1, bottom = Math.min(H - 1, Math.round(lastLine + rowGap));
      if (isItem(top, bottom, cell)) { rows.push({ top, bottom }); lastLine = null; }
    }

    const counts = new Int32Array(W);
    let height = 0;
    rows.forEach(r => {
      height += r.bottom - Math.max(0, r.top) + 1;
      const c = columnCounts(r.top, r.bottom);
      for (let x = 0; x < W; x++) counts[x] += c[x];
    });
    const bars = barChain(counts, height * 0.25, cell, 6 * k);
    if (bars.length < 3) return null;
    return { rows, bars, k, W, H, lastLine };
  }

  function hasInk(src, box, k) {
    const x = Math.max(0, Math.round(box.x)), y = Math.max(0, Math.round(box.y));
    const w = Math.min(src.width - x, Math.round(box.w)), h = Math.min(src.height - y, Math.round(box.h));
    if (w <= 0 || h <= 0) return false;
    const p = src.getContext('2d', { willReadFrequently: true }).getImageData(x, y, w, h).data;
    let n = 0;
    for (let i = 0; i < p.length; i += 4) if (p[i] * 0.299 + p[i + 1] * 0.587 + p[i + 2] * 0.114 < 150) n++;
    return n >= 4 * k * k;
  }

  // ตาราง PEGAN: หาเส้นแถวที่ห่างเท่ากัน และใช้คอลัมน์รายละเอียด (กว้างสุด) เป็นจุดอ้างอิง
  function detectGrid(canvas) {
    const W = canvas.width, H = canvas.height;
    const d = canvas.getContext('2d', { willReadFrequently: true }).getImageData(0, 0, W, H).data;
    const lum = (x, y) => { const i = (y * W + x) * 4; return d[i] * 0.299 + d[i + 1] * 0.587 + d[i + 2] * 0.114; };
    const xa = Math.floor(W * 0.12), xb = Math.floor(W * 0.88);
    const mids = [];
    let run = null;
    for (let y = 2; y < H - 2; y++) {
      let n = 0, total = 0;
      for (let x = xa; x < xb; x += 3) {
        total++;
        const v = lum(x, y);
        if (v <= lum(x, y - 2) - 6 && v <= lum(x, y + 2) - 6) n++;
      }
      if (n > total * 0.7) {
        if (run && y - run.end <= 2) run.end = y; else { if (run) mids.push((run.start + run.end) / 2); run = { start: y, end: y }; }
      }
    }
    if (run) mids.push((run.start + run.end) / 2);
    let best = [];
    for (let i = 0; i < mids.length; i++) for (let j = i + 1; j < mids.length; j++) {
      const gap = mids[j] - mids[i];
      if (gap < 18) continue;
      if (gap > 70) break;
      const tol = Math.max(2, gap * 0.08);
      const chain = [mids[i], mids[j]];
      for (let s = j + 1; s < mids.length; s++) {
        const delta = mids[s] - chain[chain.length - 1];
        if (Math.abs(delta - gap) <= tol) chain.push(mids[s]);
        else if (delta > gap + tol) break;
      }
      if (chain.length > best.length) best = chain;
    }
    if (best.length < 4) return null;
    const gap = (best[best.length - 1] - best[0]) / (best.length - 1);
    const top = Math.round(best[0]), bottom = Math.round(best[best.length - 1]);
    const off = 2;
    const peaks = [];
    let col = null;
    for (let x = off; x < W - off; x++) {
      let n = 0, total = 0;
      for (let y = top + 3; y < bottom - 3; y += 2) {
        total++;
        const v = lum(x, y);
        if (v <= lum(x - off, y) - 5 && v <= lum(x + off, y) - 5) n++;
      }
      if (total && n / total >= 0.6) {
        if (col && x - col.end <= 3) col.end = x; else { if (col) peaks.push((col.start + col.end) / 2); col = { start: x, end: x }; }
      }
    }
    if (col) peaks.push((col.start + col.end) / 2);
    // ยึดคอลัมน์ F (แคบสุด และมีคอลัมน์จำนวนเงินกว้างอยู่ทางขวา) เพราะคอลัมน์รหัสอาจกว้างกว่ารายละเอียด
    const widths = peaks.slice(1).map((x, i) => x - peaks[i]);
    let f = -1;
    for (let i = 7; i < widths.length - 1; i++) {
      if (widths[i + 1] >= widths[i] * 3 && (f < 0 || widths[i] < widths[f])) f = i;
    }
    let desc = f >= 0 ? f - 6 : -1;
    if (desc < 1 || desc + 8 >= peaks.length) {
      desc = -1;
      let widest = 0;
      for (let i = 1; i + 8 < peaks.length; i++) {
        if (peaks[i + 1] - peaks[i] > widest) { widest = peaks[i + 1] - peaks[i]; desc = i; }
      }
    }
    if (desc < 1) return null;
    const c = i => [peaks[desc + i], peaks[desc + i + 1]];
    // ขอบล่างตาราง: เส้นสุดท้ายที่ต่อเนื่องจากแถวสินค้า (แถวว่างยังมีเส้น แต่บางเส้นอาจเป็นสีอื่น)
    let tableBottom = best[best.length - 1];
    for (const m of mids) if (m > tableBottom && m - tableBottom <= gap * 1.6) tableBottom = m;
    return { lines: best, gap, bottom: tableBottom, k: gap / 28.5, W, H, code: c(-1), desc: c(0), qty: c(2), price: c(4), discount: c(5), amount: c(7) };
  }

  async function readGrid(g, src, G) {
    const worker = await getWorker();
    const k = G.k;
    const lowRes = k < 0.6;
    const cell = (c, t) => ({ x: c[0] + 3 * k, y: t + 3 * k, w: c[1] - c[0] - 6 * k, h: G.gap - 5 * k });
    const many = async (b, chars) => {
      const out = [];
      for (const s of [2, 3, 4]) out.push((await ocr(worker, cropCanvas(src, b.x, b.y, b.w, b.h, s / k, true), chars)).trim());
      return out;
    };
    const money = async b => SkuCore.voteNumber((await many(inkBox(src, b, k), '0123456789.,')).map(SkuCore.parseMoney));
    const tops = [G.lines[0] - G.gap, ...G.lines.slice(0, -1)];
    // หัวตารางพื้นสีส้มอ่อน แถวสินค้าเริ่มหลังแถวนี้
    const tint = b => {
      const x = Math.max(0, Math.round(b.x)), y = Math.max(0, Math.round(b.y));
      const w = Math.min(src.width - x, Math.round(b.w)), h = Math.min(src.height - y, Math.round(b.h));
      if (w <= 0 || h <= 0) return 0;
      const p = src.getContext('2d', { willReadFrequently: true }).getImageData(x, y, w, h).data;
      const diffs = [];
      for (let n = 0; n < p.length; n += 16) diffs.push(p[n] - p[n + 2]);
      diffs.sort((a, b2) => a - b2);
      return diffs[Math.floor(diffs.length / 2)];
    };
    let firstRow = 0;
    tops.forEach((t, i) => { if (tint(cell(G.code, t)) > 15) firstRow = i + 1; });
    const out = [];
    let amountSum = 0, allLines = true;
    for (let i = firstRow; i < tops.length; i++) {
      if (g.cancelled) return;
      const t = tops[i];
      const codeBox = cell(G.code, t);
      if (t < 0 || !hasInk(src, codeBox, k)) continue;
      showProgress(g, `แถว ${out.length + 1}`, 0.08 + 0.88 * i / tops.length);
      const codeReads = await many(codeBox, 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789-/ ');
      let sku = SkuCore.resolvePegan(codeReads, catalog);
      const descBox = cell(G.desc, t);
      let seenBox = codeBox;
      if (!sku.sku) {
        const ego = SkuCore.resolveEgo(codeReads, await many(descBox, 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789()/ '), colorMap, catalog);
        if (ego) { sku = ego; seenBox = descBox; }
      }
      const qtyBox = cell(G.qty, t);
      // จำนวนบางโปรแกรมเขียน 1.00
      const qtyRaw = await many(inkBox(src, qtyBox, k), '0123456789.');
      const qtyRead = SkuCore.voteQty(qtyRaw.map(x => { const m = x.match(/^(\d+)\.\d*$/); return m ? m[1] : x.replace(/\D/g, ''); }));
      const price = await money(cell(G.price, t));
      // ช่องส่วนลดว่าง = ไม่มีส่วนลด
      const discBox = cell(G.discount, t);
      let discount = 0;
      if (hasInk(src, discBox, k)) {
        const discountText = await many(inkBox(src, discBox, k), '0123456789');
        discount = SkuCore.voteNumber(discountText.map(x => parseInt(x.replace(/\D/g, ''), 10)).filter(x => !isNaN(x) && x <= 100));
      }
      const amount = await money(cell(G.amount, t));
      let qty = qtyRead.qty, qtySure = false;
      if (price !== null && discount !== null && amount !== null) {
        const fromAmount = SkuCore.qtyFromAmount(price, discount, amount);
        if (qty && SkuCore.lineMatches(Number(qty), price, discount, amount)) qtySure = true;
        else if (fromAmount) { qty = String(fromAmount); qtySure = !qtyRead.qty || Number(qtyRead.qty) === fromAmount * 100; }
      }
      if (amount !== null) amountSum += amount; else allLines = false;
      out.push({
        sku: sku.sku, qty, skuSure: sku.sure && !lowRes, qtySure: qtySure && !lowRes, alts: sku.alts, checked: false,
        skuImg: preview(src, seenBox.x, seenBox.y, seenBox.w, seenBox.h, 28), qtyImg: preview(src, qtyBox.x, qtyBox.y, qtyBox.w, qtyBox.h, 28),
        meta: sku.meta,
      });
    }
    if (g.cancelled) return;
    if (!out.length) return failGroup(g, 'ไม่พบรายการสินค้าในตาราง');
    showProgress(g, 'กำลังอ่านยอดเงินในภาพ', 0.97);
    const last = G.lines[G.lines.length - 1];
    const footerMoney = [];
    const spots = [last + 0.4 * G.gap, last + 1.4 * G.gap, G.bottom - 0.1 * G.gap, G.bottom + 0.2 * G.gap, G.bottom + 0.5 * G.gap];
    for (const spot of spots) {
      const y = spot + 2 * k;
      if (y + G.gap > G.H) continue;
      const box = { x: G.amount[0] + 12 * k, y, w: G.amount[1] - G.amount[0] - 14 * k, h: G.gap - 2 * k };
      for (const s of [2, 3, 4]) {
        const v = SkuCore.parseMoney(await ocr(worker, cropCanvas(src, box.x, box.y, box.w, box.h, s / k, true), '0123456789.,'));
        if (v !== null) footerMoney.push(v);
      }
    }
    if (g.cancelled) return;
    g.form = 'grid';
    g.rows = out;
    g.footerReads = [];
    g.money = { sum: Math.round(amountSum * 100) / 100, ok: allLines && footerMoney.some(v => Math.abs(v - amountSum) < 0.015) };
    g.lowRes = lowRes;
    g.state = 'done';
    g.file = null;
    renderGroup(g);
    paint();
  }

  // ตัดให้พอดีตัวอักษร ไซซ์ตัวเดียวจะอ่านแม่นขึ้น
  function inkBox(src, box, k) {
    const x0 = Math.max(0, Math.round(box.x)), y0 = Math.max(0, Math.round(box.y));
    const w = Math.min(src.width - x0, Math.round(box.w)), h = Math.min(src.height - y0, Math.round(box.h));
    const p = src.getContext('2d', { willReadFrequently: true }).getImageData(x0, y0, w, h).data;
    let minX = w, maxX = -1, minY = h, maxY = -1;
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
      const i = (y * w + x) * 4;
      if (p[i] * 0.299 + p[i + 1] * 0.587 + p[i + 2] * 0.114 < 170) { if (x < minX) minX = x; if (x > maxX) maxX = x; if (y < minY) minY = y; if (y > maxY) maxY = y; }
    }
    if (maxX < 0) return box;
    const m = 1.5 * k;
    return { x: Math.max(0, x0 + minX - m), y: Math.max(0, y0 + minY - m), w: maxX - minX + 1 + 2 * m, h: maxY - minY + 1 + 2 * m };
  }

  async function readDoc(g, src, D) {
    const worker = await getWorker();
    const k = D.k;
    const lowRes = k < MIN_ZOOM;
    const b0 = D.bars[0];
    const many = async (b, chars, psm, mode) => {
      const out = [];
      for (const s of DOC_SCALES) out.push((await ocr(worker, cropCanvas(src, b.x, b.y, b.w, b.h, s / k, mode || true), chars, psm)).replace(/\s/g, ''));
      return out;
    };
    const out = [];
    for (let i = 0; i < D.rows.length; i++) {
      if (g.cancelled) return;
      showProgress(g, `แถว ${i + 1} จาก ${D.rows.length}`, 0.08 + 0.88 * i / D.rows.length);
      const t = D.rows[i].top, rowH = D.rows[i].bottom - t;
      const modelReads = await many({ x: Math.max(0, b0 - 230 * k), y: t + 1 * k, w: 62 * k, h: 17 * k }, '0123456789');
      const colorReads = await many({ x: b0 - 168 * k, y: t + 15 * k, w: 36 * k, h: 18 * k }, '0123456789');
      const totalBox = { x: b0 + 290 * k, y: t + 15 * k, w: 32 * k, h: 18 * k };
      const total = SkuCore.voteQty(await many(totalBox, '0123456789'));
      const cells = [];
      for (let c = 0; c < D.bars.length - 1; c++) {
        const bx = D.bars[c], nx = D.bars[c + 1];
        const label = { x: bx + 3 * k, y: t + 1 * k, w: 30 * k, h: 16 * k };
        if (!hasInk(src, label, k)) continue;
        const tight = inkBox(src, label, k);
        const sizeReads = [...await many(tight, 'XSML234567', '8'), ...await many(tight, 'XSML234567', '10'), ...await many(tight, 'XSML234567', '8', 'bin')];
        const sizes = sizeReads.map(SkuCore.parseDocSize).filter(Boolean);
        const counted = {};
        sizes.forEach(s => { counted[s] = (counted[s] || 0) + 1; });
        const size = Object.keys(counted).sort((a, b) => counted[b] - counted[a])[0] || '';
        const qtyBox = { x: bx + 24 * k, y: t + 15 * k, w: nx - bx - 26 * k, h: 18 * k };
        const qty = SkuCore.voteQty(await many(qtyBox, '0123456789'));
        cells.push({ size, qty, sizeSure: sizes.length >= 2 && counted[size] / sizes.length >= 0.75, bx, nx });
      }
      const single = cells.length === 1;
      const cellSum = cells.reduce((a, c) => a + parseInt(c.qty.qty || '0', 10), 0);
      const totalNum = parseInt(total.qty || '', 10);
      const sumOk = !isNaN(totalNum) && cellSum === totalNum;
      cells.forEach(c => {
        const res = SkuCore.resolveDoc({ modelReads, colorReads, size: c.size }, colorMap, catalog);
        let qty = c.qty.qty;
        let qtySure = sumOk;
        if (single && !isNaN(totalNum) && total.sure) {
          qtySure = !qty || qty === total.qty;
          qty = total.qty;
        }
        out.push({
          sku: res.sku, qty, skuSure: res.sure && c.sizeSure && !lowRes, qtySure: qtySure && !lowRes, alts: [], checked: false,
          skuImg: preview(src, Math.max(0, b0 - 230 * k), t, 100 * k, rowH, 40), qtyImg: preview(src, c.bx, t, c.nx - c.bx, rowH, 40),
          meta: { model: res.model, colorCode: res.colorCode, colorName: res.colorName, size: c.size, options: res.options },
        });
      });
    }
    if (g.cancelled) return;
    showProgress(g, 'กำลังอ่านยอดท้ายเอกสาร', 0.97);
    const footerReads = [];
    const fy = D.lastLine === null ? D.H : D.lastLine + 15 * k;
    const footerBox = { x: b0 + 290 * k, y: fy, w: 32 * k, h: Math.min(18 * k, D.H - fy) };
    if (footerBox.h >= 10 * k && hasInk(src, footerBox, k)) {
      for (const mode of [true, 'bin']) for (const s of QTY_SCALES) {
        const v = (await ocr(worker, cropCanvas(src, footerBox.x, footerBox.y, footerBox.w, footerBox.h, s / k, mode), '0123456789')).replace(/\D/g, '');
        if (v) footerReads.push(parseInt(v, 10));
      }
    }
    if (g.cancelled) return;
    g.form = 'doc';
    g.rows = out;
    g.footerReads = footerReads;
    g.lowRes = lowRes;
    g.state = 'done';
    g.file = null;
    renderGroup(g);
    paint();
  }

  function applyColor(row, name) {
    saveColor(row.meta.model, row.meta.colorCode, name);
    groups.forEach(g => {
      let changed = false;
      g.rows.forEach(r => {
        if (!r.meta || r.meta.model !== row.meta.model || r.meta.colorCode !== row.meta.colorCode || (r.checked && r !== row)) return;
        const actual = SkuCore.matchColor(r.meta.model, name, catalog);
        if (!actual || !r.meta.size) return;
        r.sku = catalog.get(`${r.meta.model}-${actual}-${r.meta.size}`) || `${r.meta.model}-${actual}-${r.meta.size}`;
        r.meta.colorName = actual;
        r.skuSure = catalog.has(r.sku);
        changed = true;
      });
      if (changed) renderGroup(g);
    });
    paint();
  }

  function cropCanvas(src, x, y, w, h, scale, stretch) {
    const pad = 16;
    const c = document.createElement('canvas');
    c.width = Math.round(w * scale) + pad * 2;
    c.height = Math.round(h * scale) + pad * 2;
    const g = c.getContext('2d', { willReadFrequently: true });
    g.fillStyle = '#fff';
    g.fillRect(0, 0, c.width, c.height);
    g.imageSmoothingEnabled = true;
    g.imageSmoothingQuality = 'high';
    g.drawImage(src, x, y, w, h, pad, pad, c.width - pad * 2, c.height - pad * 2);
    if (stretch) {
      const im = g.getImageData(0, 0, c.width, c.height), p = im.data;
      let lo = 255, hi = 0;
      for (let i = 0; i < p.length; i += 4) { const v = (p[i] * 299 + p[i + 1] * 587 + p[i + 2] * 114) / 1000; if (v < lo) lo = v; if (v > hi) hi = v; }
      const span = Math.max(1, hi - lo);
      for (let i = 0; i < p.length; i += 4) {
        let v = ((p[i] * 299 + p[i + 1] * 587 + p[i + 2] * 114) / 1000 - lo) * 255 / span;
        if (stretch === 'bin') v = v >= 165 ? 255 : 0;
        p[i] = p[i + 1] = p[i + 2] = v; p[i + 3] = 255;
      }
      g.putImageData(im, 0, 0);
    }
    return c;
  }

  async function ocr(worker, canvas, chars, psm) {
    const mode = psm || '7';
    if (chars + mode !== lastChars) {
      await worker.setParameters({ tessedit_pageseg_mode: mode, user_defined_dpi: '300', preserve_interword_spaces: '1', tessedit_char_whitelist: chars });
      lastChars = chars + mode;
    }
    return (await worker.recognize(canvas)).data.text;
  }

  function preview(src, x, y, w, h, cssH) {
    const c = document.createElement('canvas');
    const r = window.devicePixelRatio || 1;
    c.height = Math.round(cssH * r);
    c.width = Math.round(c.height * w / h);
    c.style.height = cssH + 'px';
    c.style.width = Math.round(cssH * w / h) + 'px';
    const g = c.getContext('2d');
    g.imageSmoothingQuality = 'high';
    g.drawImage(src, x, y, w, h, 0, 0, c.width, c.height);
    return c;
  }

  function showProgress(g, text, frac) {
    const finished = groups.filter(x => x.state === 'done' || x.state === 'error').length;
    $('status').hidden = false;
    $('status-text').textContent = `กำลังอ่านรูป ${groups.indexOf(g) + 1} จาก ${groups.length} · ${text}`;
    $('bar-fill').style.width = (100 * (finished + frac) / Math.max(1, groups.length)) + '%';
  }

  function failGroup(g, message) {
    g.state = 'error';
    g.error = message;
    g.file = null;
    renderGroup(g);
    paint();
  }

  async function readGroup(g) {
    g.state = 'read';
    paint();
    try {
      showProgress(g, 'กำลังเปิดภาพ', 0.02);
      const bmp = await createImageBitmap(g.file);
      const src = document.createElement('canvas');
      src.width = bmp.width; src.height = bmp.height;
      src.getContext('2d', { willReadFrequently: true }).drawImage(bmp, 0, 0);
      bmp.close();

      const L = detectLayoutAnySize(src);
      if (L && L.type === 'list') {
        showProgress(g, 'กำลังเตรียมตัวอ่าน', 0.05);
        return await readList(g, src, L);
      }
      if (!L) {
        // ตาราง PEGAN มีเส้นตั้งยาวตลอดแถว ส่วนใบสั่งมีแค่ขีดสั้น จึงต้องเช็ก PEGAN ก่อน
        const G = detectGrid(src);
        if (G) {
          showProgress(g, 'กำลังเตรียมตัวอ่าน', 0.05);
          return await readGrid(g, src, G);
        }
        const D = detectDoc(src);
        if (!D) return failGroup(g, 'ไม่พบตารางสินค้า ลองแคปให้เห็นตารางและเส้นแบ่งแถวครบ');
        showProgress(g, 'กำลังเตรียมตัวอ่าน', 0.05);
        return await readDoc(g, src, D);
      }
      showProgress(g, 'กำลังเตรียมตัวอ่าน', 0.05);
      const worker = await getWorker();
      const k = L.k;
      const lowRes = k < MIN_ZOOM;
      const out = [];
      for (let i = 0; i < L.ys.length; i++) {
        if (g.cancelled) return;
        const y = L.ys[i];
        showProgress(g, `แถว ${i + 1} จาก ${L.ys.length}`, 0.08 + 0.88 * i / L.ys.length);
        const skuX = L.btnX + 70 * k, skuY = y - 8 * k, skuW = 118 * k, skuH = 16 * k;
        const nameX = L.btnX + 192 * k, nameW = Math.min(270 * k, L.W - (L.btnX + 192 * k));
        const reads = [], nameTexts = [];
        for (const s of SCALES) {
          reads.push((await ocr(worker, cropCanvas(src, skuX, skuY, skuW, skuH, s / k, true), SKU_CHARS)).replace(/\s/g, ''));
          const nameText = await ocr(worker, cropCanvas(src, nameX, skuY, nameW, skuH, s / k, true), SKU_CHARS);
          nameTexts.push(nameText);
          const token = nameText.trim().split(/\s+/).filter(t => /^W[A-Z]-/.test(t)).pop();
          if (token) reads.push(token);
        }
        const qX = L.qtyA + 5 * k, qW = L.qtyB - L.qtyA - 10 * k, qY = y - 7 * k, qH = 14 * k;
        const qReads = [];
        for (const s of QTY_SCALES) qReads.push((await ocr(worker, cropCanvas(src, qX, qY, qW, qH, s / k, true), '0123456789')).replace(/\s/g, ''));
        const sku = SkuCore.resolveWarrix(SkuCore.voteSku(reads), catalog, nameTexts), qty = SkuCore.voteQty(qReads);
        out.push({
          sku: sku.sku, qty: qty.qty, skuSure: sku.sure && !lowRes, qtySure: qty.sure && !lowRes, alts: sku.alts, checked: false,
          skuImg: preview(src, skuX, skuY, skuW, skuH, 28), qtyImg: preview(src, qX, qY, qW, qH, 28),
        });
      }
      if (g.cancelled) return;
      showProgress(g, 'กำลังอ่านยอดรวมในภาพ', 0.97);
      const fy = L.ys[L.ys.length - 1] + 40.3 * k;
      const footerReads = [], footerAlt = [];
      if (fy + 8 * k < L.H) {
        const fx = L.W * 0.69, fw = L.W * 0.0365;
        for (const mode of [true, 'bin']) for (const s of QTY_SCALES) {
          // ยอดบางใบเขียน 22.00 ถ้าจุดหายจะกลายเป็น 2200 จึงเก็บค่าที่หาร 100 ไว้เทียบด้วย
          const t = (await ocr(worker, cropCanvas(src, fx, fy - 7 * k, fw, 14 * k, s / k, mode), '0123456789.')).replace(/[^\d.]/g, '');
          const m = t.match(/^(\d+)/);
          if (!m) continue;
          const v = parseInt(m[1], 10);
          footerReads.push(v);
          if (!t.includes('.') && v >= 100 && v % 100 === 0) footerAlt.push(v / 100);
        }
      }
      if (g.cancelled) return;
      g.rows = out;
      g.footerReads = footerReads;
      g.footerAlt = footerAlt;
      g.lowRes = lowRes;
      g.state = 'done';
      g.file = null;
      renderGroup(g);
      paint();
    } catch (e) {
      console.error(e);
      if (!g.cancelled) failGroup(g, 'อ่านรูปนี้ไม่สำเร็จ ลองแคปใหม่ให้ชัดขึ้น');
    }
  }

  // อ่านทีละรูปตามคิว รูปที่เพิ่มระหว่างอ่านจะต่อท้ายคิวเอง
  async function pump() {
    if (pumping) return;
    pumping = true;
    try {
      $('status').hidden = false;
      $('status-text').textContent = 'กำลังเตรียมฐาน SKU';
      await catalogReady;
      for (;;) {
        const g = groups.find(x => x.state === 'wait');
        if (!g) break;
        await readGroup(g);
      }
    } finally {
      pumping = false;
      $('status').hidden = true;
      paint();
    }
  }

  const needsCheck = r => !r.checked && (!r.skuSure || !r.qtySure || !r.sku || !/^\d+$/.test(r.qty) || !catalog.has(r.sku));

  function buildRow(g, r, i) {
    const tr = document.createElement('tr');
    const num = document.createElement('td'); num.className = 'num'; num.textContent = i + 1;
    const seen = document.createElement('td'); seen.className = 'seen';
    seen.append(r.skuImg, r.qtyImg);

    const skuCell = document.createElement('td');
    const sku = document.createElement('input');
    sku.value = r.sku; sku.spellcheck = false; sku.setAttribute('aria-label', `SKU แถว ${i + 1}`);
    sku.addEventListener('input', () => { r.sku = sku.value.trim().toUpperCase(); r.checked = true; paint(); });
    skuCell.append(sku);
    const chips = document.createElement('div'); chips.className = 'chips';
    r.alts.filter(a => a !== r.sku).forEach(a => {
      const b = document.createElement('button');
      b.type = 'button'; b.textContent = a; b.title = 'ใช้ SKU นี้';
      b.addEventListener('click', () => { r.sku = a; r.alts = [a, ...r.alts.filter(x => x !== a)]; r.checked = true; renderGroup(g); paint(); });
      chips.append(b);
    });
    if (r.meta && r.meta.options.length) {
      const pick = document.createElement('select');
      pick.setAttribute('aria-label', `เลือกสีแถว ${i + 1}`);
      const blank = document.createElement('option');
      blank.value = ''; blank.textContent = r.meta.colorName ? 'เปลี่ยนสี' : `เลือกสีของเลข ${r.meta.colorCode || '-'}`;
      pick.append(blank);
      r.meta.options.forEach(name => { const o = document.createElement('option'); o.value = name; o.textContent = name; pick.append(o); });
      pick.value = r.meta.colorName && r.meta.options.includes(r.meta.colorName) ? r.meta.colorName : '';
      pick.addEventListener('change', () => { if (pick.value) { r.checked = true; applyColor(r, pick.value); } });
      chips.append(pick);
    }
    skuCell.append(chips);

    const qtyCell = document.createElement('td');
    const qty = document.createElement('input');
    qty.className = 'qty'; qty.inputMode = 'numeric'; qty.value = r.qty; qty.setAttribute('aria-label', `จำนวนแถว ${i + 1}`);
    qty.addEventListener('input', () => { r.qty = qty.value.replace(/\D/g, ''); qty.value = r.qty; r.checked = true; paint(); });
    qtyCell.append(qty);

    const st = document.createElement('td'); st.className = 'state';
    const ok = document.createElement('button');
    ok.type = 'button'; ok.textContent = 'ยืนยันแถวนี้';
    ok.addEventListener('click', () => { r.checked = true; paint(); });
    const label = document.createElement('span');
    const note = document.createElement('span');
    note.className = 'dbnote';
    note.textContent = 'ไม่พบในฐาน';
    st.append(ok, label, note);
    tr.append(num, seen, skuCell, qtyCell, st);
    r.tr = tr; r.okBtn = ok; r.label = label; r.chips = chips; r.note = note;
    return tr;
  }

  function renderGroup(g) {
    g.tbody.textContent = '';
    const tr = document.createElement('tr');
    tr.className = 'group';
    const th = document.createElement('th');
    th.colSpan = 5;
    const head = document.createElement('div');
    head.className = 'ghead';
    const make = cls => { const s = document.createElement('span'); if (cls) s.className = cls; head.append(s); return s; };
    const ui = { name: make('gname'), stat: make(), match: make(), flag: make(), low: make('warn') };
    ui.name.title = g.name;
    ui.low.textContent = 'ภาพเล็กเกินไป ควรแคปใหม่ที่ซูม 100% ขึ้นไป';
    const remove = document.createElement('button');
    remove.type = 'button';
    remove.textContent = 'เอารูปนี้ออก';
    remove.addEventListener('click', () => removeGroup(g));
    head.append(remove);
    th.append(head);
    tr.append(th);
    g.tbody.append(tr);
    g.ui = ui;
    g.rows.forEach((r, i) => g.tbody.append(buildRow(g, r, i)));
  }

  function removeGroup(g) {
    if (g.rows.some(r => r.checked) && !confirm(`รูปนี้มีแถวที่ตรวจแล้ว ${g.rows.filter(r => r.checked).length} แถว ต้องการเอาออกไหม?`)) return;
    g.cancelled = true;
    g.tbody.remove();
    groups = groups.filter(x => x !== g);
    paint();
  }

  function clearAll() {
    if (!groups.length || !confirm(`ล้างผลทั้ง ${groups.length} รูป? แถวที่ตรวจไว้จะหายไปด้วย`)) return;
    groups.forEach(g => { g.cancelled = true; g.tbody.remove(); });
    groups = [];
    paint();
  }

  // ใบสั่งหลายหน้า: ยอดท้ายเอกสารคือยอดรวมของหน้าก่อนหน้าทั้งหมดจนถึงหน้าท้าย
  function linkDocPages() {
    let pages = [], sum = 0;
    groups.forEach(g => {
      if (g.state !== 'done' || g.form !== 'doc') return;
      g.doc = null;
      pages.push(g);
      sum += g.rows.reduce((a, r) => a + qtyOf(r), 0);
      if (g.footerReads.length) {
        const counted = {};
        g.footerReads.forEach(v => { counted[v] = (counted[v] || 0) + 1; });
        const footer = parseInt(Object.keys(counted).sort((a, b) => counted[b] - counted[a])[0], 10);
        const doc = { sum, footer: g.footerReads.includes(sum) ? sum : footer, matched: g.footerReads.includes(sum) };
        pages.forEach(p => { p.doc = doc; });
        pages = [];
        sum = 0;
      }
    });
  }

  function docFooter(g) {
    const d = g.doc;
    if (!d) return { key: 'unclear', cls: 'warn', text: 'ยังไม่เจอหน้าท้ายเอกสาร กรุณาเทียบยอดเอง' };
    if (d.matched) return { key: 'ok', cls: 'good', text: `ตรงกับยอดท้ายเอกสาร (${d.footer})` };
    if (d.footer > d.sum) return { key: 'unclear', cls: 'warn', text: `ท้ายเอกสาร ${d.footer} ตัว ยังขาด ${d.footer - d.sum} ตัว อาจอยู่หน้าอื่น` };
    return { key: 'bad', cls: 'bad', text: `เกินยอดท้ายเอกสาร (${d.footer})` };
  }

  function footerState(g, total) {
    if (g.form === 'doc') return docFooter(g);
    if (g.form === 'grid') {
      const text = g.money.sum.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
      return g.money.ok
        ? { key: 'ok', cls: 'good', text: `ยอดเงินตรงกับภาพ (${text})` }
        : { key: 'unclear', cls: 'warn', text: 'อ่านยอดเงินไม่ชัด กรุณาเทียบเอง' };
    }
    const reads = g.footerReads, alt = g.footerAlt || [];
    if (reads.includes(total) || alt.includes(total)) return { key: 'ok', cls: 'good', text: `ตรงกับยอดในภาพ (${total})` };
    if (reads.length >= 2 && reads.every(v => v === reads[0])) return { key: 'bad', cls: 'bad', text: `ไม่ตรงกับยอดในภาพ (${alt.length === reads.length ? alt[0] : reads[0]})` };
    return { key: 'unclear', cls: 'warn', text: 'อ่านยอดรวมไม่ชัด กรุณาเทียบเอง' };
  }

  const qtyOf = r => parseInt(r.qty || '0', 10);
  const doneRows = () => groups.flatMap(g => g.state === 'done' ? g.rows : []).filter(r => r.sku);

  function exportRows() {
    const rows = doneRows();
    if (!$('merge').checked) return rows.map(r => ({ sku: r.sku, qty: r.qty }));
    const sum = new Map();
    rows.forEach(r => sum.set(r.sku, (sum.get(r.sku) || 0) + qtyOf(r)));
    return [...sum].map(([sku, qty]) => ({ sku, qty: String(qty) }));
  }

  function paint() {
    let flagged = 0, total = 0, ok = 0, bad = 0, unclear = 0, failed = 0, missing = 0;
    linkDocPages();
    groups.forEach((g, idx) => {
      const ui = g.ui;
      ui.name.textContent = `รูป ${idx + 1} · ${g.name}`;
      const done = g.state === 'done';
      ui.match.hidden = ui.flag.hidden = !done;
      ui.low.hidden = !(done && g.lowRes);
      ui.stat.className = g.state === 'error' ? 'bad' : '';
      if (g.state === 'wait') ui.stat.textContent = 'รอคิว';
      if (g.state === 'read') ui.stat.textContent = 'กำลังอ่าน';
      if (g.state === 'error') { ui.stat.textContent = g.error; failed++; }
      if (!done) return;
      let gFlag = 0, gTotal = 0;
      g.rows.forEach(r => {
        const need = needsCheck(r);
        if (need) gFlag++;
        gTotal += qtyOf(r);
        r.tr.classList.toggle('flag', need);
        r.okBtn.hidden = !need;
        r.chips.hidden = !need;
        r.label.hidden = need;
        const inDb = catalog.has(r.sku);
        if (!inDb) missing++;
        r.note.hidden = inDb;
        r.label.textContent = r.checked ? 'ตรวจแล้ว' : 'ตรงฐาน';
      });
      flagged += gFlag;
      total += gTotal;
      ui.stat.textContent = `${g.rows.length} รายการ · รวม ${gTotal.toLocaleString('en-US')} ตัว`;
      const f = footerState(g, gTotal);
      ui.match.textContent = f.text;
      ui.match.className = f.cls;
      if (f.key === 'ok') ok++; else if (f.key === 'bad') bad++; else unclear++;
      ui.flag.textContent = gFlag ? `ต้องตรวจ ${gFlag} แถว` : 'ตรวจครบแล้ว';
      ui.flag.className = gFlag ? 'warn' : 'good';
    });
    $('result').hidden = !groups.length;
    $('s-images').textContent = groups.length;
    $('s-count').textContent = exportRows().length;
    $('s-total').textContent = total.toLocaleString('en-US');

    const m = $('s-match');
    const read = ok + bad + unclear;
    if (!read) { m.textContent = ''; m.className = ''; }
    else if (bad) { m.textContent = `ยอดไม่ตรง ${bad} รูป`; m.className = 'bad'; }
    else if (unclear) { m.textContent = `ต้องเทียบยอดเอง ${unclear} รูป`; m.className = 'warn'; }
    else { m.textContent = `ยอดตรงครบ ${ok} รูป`; m.className = 'good'; }

    const fl = $('s-flag');
    fl.textContent = !read ? '' : flagged ? `ต้องตรวจ ${flagged} แถว` : 'ตรวจครบแล้ว';
    fl.className = flagged ? 'warn' : 'good';
    const fa = $('s-failed');
    fa.hidden = !failed;
    fa.textContent = `อ่านไม่สำเร็จ ${failed} รูป`;
    const mi = $('s-missing');
    mi.hidden = !missing;
    mi.textContent = `ไม่พบในฐาน ${missing} แถว`;

    const seen = new Map();
    doneRows().forEach(r => seen.set(r.sku, (seen.get(r.sku) || 0) + 1));
    const repeats = [...seen.values()].filter(n => n > 1).length;
    $('merge-text').textContent = repeats ? `รวม SKU ซ้ำ (${repeats})` : 'รวม SKU ซ้ำ';
  }

  function toast(text) {
    const t = $('toast');
    t.textContent = text;
    t.hidden = false;
    clearTimeout(toast.t);
    toast.t = setTimeout(() => { t.hidden = true; }, 3200);
  }

  function exportNotes() {
    const flagged = groups.flatMap(g => g.state === 'done' ? g.rows : []).filter(needsCheck).length;
    const failed = groups.filter(g => g.state === 'error').length;
    const pending = groups.filter(g => g.state === 'wait' || g.state === 'read').length;
    const notes = [];
    if (pending) notes.push(`ยังอ่านไม่จบ ${pending} รูป`);
    if (failed) notes.push(`ไม่มีข้อมูลจาก ${failed} รูปที่อ่านไม่สำเร็จ`);
    if (flagged) notes.push(`ยังมี ${flagged} แถวที่ควรตรวจ`);
    const missing = doneRows().filter(r => !catalog.has(r.sku)).length;
    if (missing) notes.push(`มี ${missing} แถวไม่พบในฐาน`);
    return notes.length ? ' แต่' + notes.join(', ') : '';
  }

  async function copyRows() {
    const rows = exportRows();
    if (!rows.length) return toast('ยังไม่มีรายการให้คัดลอก');
    const text = rows.map(r => `${r.sku}\t${r.qty}`).join('\r\n');
    try {
      await navigator.clipboard.writeText(text);
    } catch (e) {
      const a = document.createElement('textarea');
      a.value = text; document.body.append(a); a.select();
      document.execCommand('copy'); a.remove();
    }
    toast(`คัดลอก ${rows.length} แถวแล้ว${exportNotes()}`);
  }

  function saveCsv() {
    const rows = exportRows();
    if (!rows.length) return toast('ยังไม่มีรายการให้บันทึก');
    const q = v => `"${String(v).replace(/"/g, '""')}"`;
    const csv = '﻿' + [['SKU', 'จำนวน'].map(q).join(','), ...rows.map(r => [q(r.sku), r.qty].join(','))].join('\r\n');
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
    const n = new Date(), p = x => String(x).padStart(2, '0');
    a.download = `SKU-จำนวน_${n.getFullYear()}-${p(n.getMonth() + 1)}-${p(n.getDate())}_${p(n.getHours())}${p(n.getMinutes())}.csv`;
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
    toast(`บันทึก ${rows.length} แถวแล้ว${exportNotes()}`);
  }

  // กันรูปเดิมถูกนับซ้ำ แม้ชื่อไฟล์ต่างกัน
  async function fileHash(file) {
    const b = new Uint8Array(await file.arrayBuffer());
    let h = 0x811c9dc5;
    for (let i = 0; i < b.length; i++) { h ^= b[i]; h = Math.imul(h, 0x01000193); }
    return `${b.length}:${h >>> 0}`;
  }

  const isImage = f => f.type.startsWith('image/') || /\.(png|jpe?g|webp|bmp)$/i.test(f.name);
  const displayName = f => /^image\.(png|jpe?g)$/i.test(f.name) ? 'ภาพจากคลิปบอร์ด' : f.name;

  async function addFiles(list) {
    const all = [...(list || [])];
    const images = all.filter(isImage).sort((a, b) => a.name.localeCompare(b.name, 'th', { numeric: true }));
    const notImages = all.length - images.length;
    let duplicates = 0, added = 0;
    for (const file of images) {
      const hash = await fileHash(file);
      if (groups.some(g => g.hash === hash)) { duplicates++; continue; }
      const g = { file, hash, name: displayName(file), state: 'wait', rows: [], footerReads: [], lowRes: false, error: '', cancelled: false, tbody: document.createElement('tbody'), ui: null };
      renderGroup(g);
      groups.push(g);
      $('table').append(g.tbody);
      added++;
    }
    if (added) { paint(); pump(); }
    const notes = [];
    if (duplicates) notes.push(`ข้ามรูปซ้ำ ${duplicates} รูป`);
    if (notImages) notes.push(`ข้าม ${notImages} ไฟล์ที่ไม่ใช่รูป`);
    if (notes.length) toast(notes.join(', '));
  }

  catalogReady = refreshCatalog();
  $('pick').addEventListener('click', () => $('file').click());
  $('file').addEventListener('change', e => { const list = [...e.target.files]; e.target.value = ''; addFiles(list); });
  $('copy').addEventListener('click', copyRows);
  $('csv').addEventListener('click', saveCsv);
  $('clear').addEventListener('click', clearAll);
  $('merge').addEventListener('change', paint);
  document.addEventListener('paste', e => {
    const items = [...(e.clipboardData ? e.clipboardData.items : [])].filter(x => x.kind === 'file' && x.type.startsWith('image/'));
    if (items.length) { e.preventDefault(); addFiles(items.map(x => x.getAsFile())); }
  });
  ['dragenter', 'dragover'].forEach(t => document.addEventListener(t, e => { e.preventDefault(); $('drop').classList.add('over'); }));
  document.addEventListener('dragleave', e => { if (!e.relatedTarget) $('drop').classList.remove('over'); });
  document.addEventListener('drop', e => { e.preventDefault(); $('drop').classList.remove('over'); addFiles(e.dataTransfer.files); });
})();
</script>
</body>
</html>
